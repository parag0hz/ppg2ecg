exp_name: a9_imeanflow_wildppg_globalz_seed42
arm: A2
model: PENGUIN (upstream class, unmodified) Flow-SSM/S5 + Improved MeanFlow
imeanflow:
  objective: improved_meanflow
  paper: arXiv:2512.02012 v2 (CVPR 2026)
  official_code: Lyy-iiis/imeanflow @ bf60cd7
  p_mean: -0.4
  p_std: 1.0
  data_proportion: 0.5
  norm_p: 1.0
  norm_eps: 0.01
  jvp: torch.func.jvp (forward-mode)
  v_theta: boundary u(z,t,t)
  cond: 'h_only: E(h) with the backbone embedder (official iMF design), h_scale=1'
  bank_hash: 2cd144684498f2796451d0eaaaed11b1ebd4b2a9112fb0efb56d502cdf383564
  selection: fixed_imf_mse
model_cfg:
  n_step: 1
  sample_rate: 128
  h_dim: 128
  ssm_block_num: 4
  ssm_ratio: 2.0
  mlp_ratio: 2.0
dataset: WildPPG
window_s: 8
sample_rate: 128
samples_per_window: 1024
preprocess:
  ppg:
    bandpass: true
    freq_range:
    - 0.5
    - 4
    zscore: true
    normalize: true
  target:
    bandpass: true
    freq_range:
    - 0.5
    - -1
    zscore: true
    normalize: true
  per_window_stats: true
  global_stats: null
  target_kind: ECG
split:
  manifest: data/manifests/split_a4_wildppg_seed42.json
  sha256: bc168144f721a73005ac14663af3fb0ae60f438c9c0fd6fc615e2119e88147c4
  protocol: A4-wildppg-holdout
  seed: 42
  train:
  - e61
  - fex
  - l38
  - n31
  - ngh
  - p5d
  - p9p
  - qm9
  - trh
  - tz8
  - u7y
  - w4p
  val:
  - an0
  - k2s
  test:
  - kjd
  - ssx
seed: 42
optimizer: AdamW(betas=(0.9,0.999))
lr: 0.001
weight_decay: 0.01
batch_size: 64
epochs_max: 300
early_stopping:
  metric: val_mae_batchmean (full n_step Heun samples)
  patience: 20
  min_delta: 0.0001
checkpoint: best val MAE
selection:
  criterion: val_mae
  min_delta: 0.0001
  n_val_banks: 4
